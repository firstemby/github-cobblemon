[versions]
# Kotlin
kotlin = "2.3.20"

# Plugins
licenser = "0.7.5"
shadow = "9.3.2"
blossom = "2.1.0"
idea-ext = "1.1.7"
versioning = "3.1.0"

# Minecraft Development
loom = "1.16-SNAPSHOT"

# Common
molang = "1.1.20"
jei-api = "29.5.0.26"
mixin = "0.8.5"
mixinExtras = "0.5.3"
asm = "9.9"

# Graal
graal = "25.0.2"
icu4j = "71.1"

# Fabric
fabric-loader = "0.18.5"
fabric-api = "0.145.4+26.1.2"
fabric-kotlin = "1.13.10+kotlin.2.3.20"
fabric-permissions-api = "0.7.0"
lambDynamicLights = "4.10.0+26.1"
mod-menu = "18.0.0-alpha.8"
c2me-fabric = "0.3.7+alpha.0.64+26.1.2-rc-1"

# NeoForge
neoforge = "26.1.2.1-beta"
neo-kotlin-for-forge = "6.2.0"
c2me-neoforge = "0.3.7+alpha.0.85+26.1.1"

# Data Storage
mongo = "4.10.2"

# Testing
junit = "6.0.3"
mockito = "5.14.2"
mockk = "1.13.14"
classgraph = "4.8.179"

[libraries]
# General Buildscript Plugins
kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
neoloom = { group = "org.relativitymc.neo-loom", name = "org.relativitymc.neo-loom.gradle.plugin", version.ref = "loom" }
shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
blossom = { group = "net.kyori", name = "blossom", version.ref = "blossom" }
ideaExt = { group = "org.jetbrains.gradle.plugin.idea-ext", name = "org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea-ext"}
licenser = { group = "net.neoforged.licenser", name = "licenser", version.ref = "licenser" }
versioning = { group = "net.nemerosa.versioning", name = "net.nemerosa.versioning.gradle.plugin", version.ref = "versioning" }

# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

# Common
jei-api = { group = "mezz.jei", name = "jei-26.1.2-common-api", version.ref = "jei-api"}
molang = { group = "local.com.bedrockk", name = "molang", version.ref = "molang" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm"}
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm"}
asm-util = { group = "org.ow2.asm", name = "asm-util", version.ref = "asm"}

# Graal
graal-core = { group = "org.graalvm.js", name = "js", version.ref = "graal" }
graal-js = { group = "org.graalvm.js", name = "js-language", version.ref = "graal" }
graal-sdk = { group = "org.graalvm.sdk", name = "graal-sdk", version.ref = "graal" }
graal-collections = { group = "org.graalvm.sdk", name = "collections", version.ref = "graal" }
graal-jniutils = { group = "org.graalvm.sdk", name = "jniutils", version.ref = "graal" }
graal-nativeimage = { group = "org.graalvm.sdk", name = "nativeimage", version.ref = "graal" }
graal-word = { group = "org.graalvm.sdk", name = "word", version.ref = "graal" }
graal-polyglot = { group = "org.graalvm.polyglot", name = "polyglot", version.ref = "graal" }
graal-icu4j = { group = "org.graalvm.shadowed", name = "icu4j", version.ref = "graal" }
graal-xz = { group = "org.graalvm.shadowed", name = "xz", version.ref = "graal" }
graal-regex = { group = "org.graalvm.regex", name = "regex", version.ref = "graal"}
graal-truffle = { group = "org.graalvm.truffle", name = "truffle-api", version.ref = "graal" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
fabric-permissions = { group = "me.lucko", name = "fabric-permissions-api", version.ref = "fabric-permissions-api" }
adorn-fabric = { group = "maven.modrinth", name = "adorn", version = "6.0.0-neoforge"}
lambDynamicLights = { group = "dev.lambdaurora.lambdynamiclights", name = "lambdynamiclights-api", version.ref = "lambDynamicLights"}
jei-fabric = { group = "mezz.jei", name = "jei-26.1.2-fabric", version.ref = "jei-api"}
mod-menu = { group = "com.terraformersmc", name = "modmenu", version.ref = "mod-menu" }
c2me-fabric = { group = "maven.modrinth", name = "c2me-fabric", version.ref = "c2me-fabric" }

# NeoForge
neoforge-api = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
neo-kotlin-forge = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "neo-kotlin-for-forge" }
jei-neoforge = { group = "mezz.jei", name = "jei-26.1.2-neoforge", version.ref = "jei-api"}
c2me-neoforge = { group = "maven.modrinth", name = "c2me-neoforge", version.ref = "c2me-neoforge" }

# Data Storage
mongo-driver-core = { group = "org.mongodb", name = "mongodb-driver-core", version.ref = "mongo" }
mongo-driver-sync = { group = "org.mongodb", name = "mongodb-driver-sync", version.ref = "mongo" }

# Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mock-kotlin = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
classgraph = { group = "io.github.classgraph", name = "classgraph", version.ref = "classgraph" }

[bundles]
kotlin = [ "kotlin-stdlib", "kotlin-reflect" ]
fabric = [ "fabric-kotlin", "fabric-permissions" ]
common-mixin-compileOnly = [ "mixin", "mixinExtras-common", "asm", "asm-tree", "asm-util" ]
common-integrations-compileOnly = [ "adorn-fabric", "jei-api" ]
fabric-integrations-implementation = [ "mod-menu" ]
fabric-integrations-runtimeOnly = [ "jei-fabric", "c2me-fabric" ]
neoforge-integrations-runtimeOnly = [ "jei-neoforge", "c2me-neoforge" ]
mongo = [ "mongo-driver-core", "mongo-driver-sync" ]
unitTesting = [ "junit-jupiter", "junit-params", "mockito-core", "mock-kotlin", "classgraph" ]

graal = [ "graal-core", "graal-sdk", "graal-regex", "graal-truffle", "icu4j", "graal-polyglot", "graal-collections",
    "graal-jniutils", "graal-nativeimage", "graal-word", "graal-js", "graal-icu4j", "graal-xz"]
